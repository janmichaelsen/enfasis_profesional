services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: nextjs
      POSTGRES_PASSWORD: nextjs_password
      POSTGRES_DB: parcel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextjs -d parcel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - .env
    environment:
      # Se comunica con el servicio 'db'
      - DATABASE_URL=postgresql://nextjs:nextjs_password@db:5432/parcel_db?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data: