services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "root"
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://nextjs:nextjs_password@db:5432/parcel_db
      - NEXTAUTH_SECRET=algun_secreto_super_seguro
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    # Esta sección es la que faltaba para ver tus archivos locales dentro de Docker
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nextjs
      POSTGRES_DB: parcel_db
      POSTGRES_PASSWORD: nextjs_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextjs -d parcel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: